server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA owns client-side routing; unknown paths return the app shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }

    # Hashed build assets are immutable, so cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Same-origin proxy: the JWT never travels cross-origin.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads can be large; do not buffer them to a temp file first.
        client_max_body_size 200m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location /health { proxy_pass http://api:8000/health; }
    location /docs   { proxy_pass http://api:8000/docs; }
    location /openapi.json { proxy_pass http://api:8000/openapi.json; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
