name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  # ------------------------------------------------------------------ lint --
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  # ----------------------------------------------------------------- tests --
  test:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Generate the synthetic fixture corpus
        run: python scripts/make_fixtures.py

      - name: Run the suite with coverage
        env:
          JWT_SECRET: ci-only-secret-not-used-anywhere-real
        run: |
          pytest tests \
            --cov=backend/app \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml \
            -q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            junit.xml
            coverage.xml

  # --------------------------------------------------- tests against Postgres
  test-postgres:
    name: Tests (Postgres)
    runs-on: ubuntu-latest
    # The models must behave identically on the database we actually deploy on;
    # SQLite is a dev convenience, not the target.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mom
          POSTGRES_PASSWORD: mom
          POSTGRES_DB: mom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mom -d mom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/make_fixtures.py
      - name: Run the suite
        env:
          JWT_SECRET: ci-only-secret-not-used-anywhere-real
          MOM_TEST_DATABASE_URL: postgresql+psycopg://mom:mom@localhost:5432/mom_test
        run: pytest tests -q

  # -------------------------------------------------------------- security --
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: bandit (static analysis)
        run: bandit -r backend scripts -ll

      - name: pip-audit (dependency CVEs)
        run: pip-audit --requirement requirements.txt --strict

      - name: Fail if a .env file was committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is committed. Secrets must never be in version control."
            exit 1
          fi
          echo "No .env in version control."

      - name: Scan the tree for hardcoded secrets
        run: |
          # Demo and test credentials are expected in their own files; anything
          # that looks like a real secret elsewhere fails the build.
          if grep -rInE "(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|sk-[A-Za-z0-9]{32,})" \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv . ; then
            echo "::error::Possible hardcoded secret found."
            exit 1
          fi
          echo "No hardcoded secrets found."

  # -------------------------------------------------------------- frontend --
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci || npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # ---------------------------------------------------------------- images --
  docker:
    name: Build images
    runs-on: ubuntu-latest
    needs: [lint, test, security, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: mom-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the reviewer editor image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: mom-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the API image
        run: |
          docker run -d --name mom-api-smoke \
            -e JWT_SECRET=ci-only-secret-not-used-anywhere-real \
            -e DATABASE_URL=sqlite:////tmp/smoke.db \
            -p 8000:8000 mom-api:${{ github.sha }}

          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health; then
              echo "API healthy."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::API did not become healthy."
              docker logs mom-api-smoke
              exit 1
            fi
            sleep 2
          done

          # The governance surface must be present in a built image, not just in dev.
          curl -sf http://127.0.0.1:8000/metrics | grep -q approval_gates_total \
            || { echo "::error::governance metrics missing"; exit 1; }

          docker rm -f mom-api-smoke

  # ------------------------------------------------------------------ gate --
  acceptance:
    name: Acceptance gate
    runs-on: ubuntu-latest
    needs: [lint, test, test-postgres, security, frontend, docker]
    steps:
      - run: echo "Lint, tests (SQLite + Postgres), security scans, frontend and images all passed."
